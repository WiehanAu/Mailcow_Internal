        owner: '401'
        group: root
        mode: '0600'

    - name: Create ecpubkey.pem file
      ansible.builtin.copy:
        dest: /var/lib/docker/volumes/mailcowdockerized_crypt-vol-1/_data/ecpubkey.pem
        content: |
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEqaefRyg8N3+O67Z1CA81vnw4E9M/
          CRicn2FUb+pn4rrsAVCtF5XhnF6cydvjFZMlx2xnO8Q3Kta8LLL8F+tDJw==
          -----END PUBLIC KEY-----
        owner: '401'
        group: root
        mode: '0644'

    - name: Block incoming traffic on port 993 using UFW
      ansible.builtin.ufw:
        rule: deny
        port: 993
        proto: tcp
        direction: in
        comment: "Block incoming traffic on port 993"

    - name: Block outgoing traffic on port 993 using UFW
      ansible.builtin.ufw:
        rule: deny
        port: 993
        proto: tcp
        direction: out
        comment: "Block outgoing traffic on port 993"

    - name: Block incoming traffic on port 25 using UFW
      ansible.builtin.ufw:
        rule: deny
