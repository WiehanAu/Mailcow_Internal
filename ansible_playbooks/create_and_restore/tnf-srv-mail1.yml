- name: Initial Setup
  hosts: mail1restoretest
  become: true
  gather_facts: false
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    ansible_user: mcrestore
    ansible_password: mcrestore
    ansible_become_password: mcrestore
    # password: ""
    # newuser: ""
    # BORG_PASSPHRASE: ""
    # borguser: ""
    # borgserver: ""
  tasks:
    - name: Update package lists
      ansible.builtin.apt:
        upgrade: true
        update_cache: true
        autoremove: true
        autoclean: true
    - name: Create a new user
      ansible.builtin.user:
        name: "{{ newuser }}"
        password: "{{ password | password_hash('sha512') }}"
        shell: /bin/bash
        home: /home/{{ newuser }}
        state: present
    - name: Ensure new user's home directory exists
      ansible.builtin.file:
        path: /home/{{ newuser }}
        state: directory
        owner: "{{ newuser }}"
        group: "{{ newuser }}"
        mode: '0755'
    - name: Add new user to sudo group
      ansible.builtin.user:
        name: "{{ newuser }}"
        groups: sudo
        append: yes

    - name: Add pub key to /root/.ssh/authorized_keys
      ansible.builtin.copy:
        dest: /root/.ssh/authorized_keys
        content: |
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMjb/AED9nl0G12/ePDyJSjyGiEI/uNa34/kUQNudsaU batman@tnfs.co.za
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHjSme9O6wTVsroGBthFSHOrF4w7Hk62Gc3tx1HkAfQ9 wiehan.aucamp@gmail.com

    - name: Resize partition 3 to 100% with parted
      ansible.builtin.shell: parted /dev/sda --script resizepart 3 100%

    - name: Wait for 5 seconds to ensure the system recognizes the changes
      ansible.builtin.wait_for:
        timeout: 5

    - name: Resize the physical volume
      ansible.builtin.shell: pvresize /dev/sda3
      register: pvresize_result

    - name: Debug pvresize result
      ansible.builtin.debug:
        msg: |
          stdout: "{{ pvresize_result.stdout }}"
          stderr: "{{ pvresize_result.stderr }}"

    - name: Check for free space in the volume group
      ansible.builtin.shell: vgs --units b --nosuffix ubuntu-vg
      register: vg_check

    - name: Debug free space in volume group
      ansible.builtin.debug:
        msg: "Free space in volume group: {{ vg_check.stdout }}"

    - name: Extend the logical volume
      ansible.builtin.shell: lvextend -l +100%FREE /dev/ubuntu-vg/ubuntu-lv
      ignore_errors: yes
      register: lvextend_result
      failed_when: false

    - name: Display error message if lvextend fails
      ansible.builtin.debug:
        msg: "lvextend failed with error: {{ lvextend_result.stderr }}"
      when: lvextend_result.rc != 0

    - name: Resize the ext4/ext3 filesystem
      ansible.builtin.shell: resize2fs /dev/ubuntu-vg/ubuntu-lv

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Create directory for apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download and add Docker GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      ansible.builtin.shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose
          - docker-compose-plugin
          - expect
          - jq
        state: present

    - name: Create /local directory
      ansible.builtin.file:
        path: /local
        state: directory
        mode: '0755'

    - name: Debug mailcow_version
      ansible.builtin.debug:
        msg: "mailcow_version={{ mailcow_version }}"

    - name: Clone Mailcow
      git:
        repo: https://github.com/mailcow/mailcow-dockerized.git
        dest: /local/mailcow-dockerized
        version: "{{ mailcow_version }}"

    - name: Get the current commit hash of the Mailcow repository
      ansible.builtin.shell: git rev-parse HEAD
      args:
        chdir: /local/mailcow-dockerized
      register: mailcow_commit_hash

    - name: Debug current commit hash of the Mailcow repository
      ansible.builtin.debug:
        msg: "Current commit hash: {{ mailcow_commit_hash.stdout }}"

    - name: Run generate_config.sh script with --dev to stop it from pullin master branch
      ansible.builtin.command: ./generate_config.sh --dev
      args:
        chdir: "/local/mailcow-dockerized"
        stdin: |
          mx.cashconverters.co.za
          Africa/Johannesburg
          1

    - name: Pull Docker images for Mailcow
      ansible.builtin.command: sudo docker compose pull
      args:
        chdir: /local/mailcow-dockerized

    - name: Update SMTP_PORT value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^SMTP_PORT='
        line: 'SMTP_PORT=26'
        backrefs: yes

    - name: Update SMTP_PORT value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^ADDITIONAL_SAN='
        line: 'ADDITIONAL_SAN=mx.*'
        backrefs: yes

    - name: Update SMTP_PORT value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^ADDITIONAL_SERVER_NAMES='
        line: 'ADDITIONAL_SERVER_NAMES=mx.cashiescard.co.za,mx.truenorth.co.za'
        backrefs: yes

    - name: Update SMTP_PORT value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^SKIP_IP_CHECK='
        line: 'SKIP_IP_CHECK=y'
        backrefs: yes

    - name: Update SMTP_PORT value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^SKIP_CLAMD='
        line: 'SKIP_CLAMD=y'
        backrefs: yes

    - name: Update SMTP_PORT value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^ALLOW_ADMIN_EMAIL_LOGIN='
        line: 'ALLOW_ADMIN_EMAIL_LOGIN=y'
        backrefs: yes

    - name: Update SMTP_PORT value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^WATCHDOG_NOTIFY_EMAIL='
        line: 'WATCHDOG_NOTIFY_EMAIL=wiehana@tnfs.co.za'
        backrefs: yes

    - name: Update SMTP_PORT value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^ACME_CONTACT='
        line: 'ACME_CONTACT=wiehana@tnfs.co.za'
        backrefs: yes

    - name: Update ACME_DNS_CHALLENGE value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^ACME_DNS_CHALLENGE='
        line: 'ACME_DNS_CHALLENGE=y'
        backrefs: yes

    - name: Update ACME_DNS_PROVIDER value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^ACME_DNS_PROVIDER='
        line: 'ACME_DNS_PROVIDER=dns_cf'
        backrefs: yes

    - name: Update ACME_ACCOUNT_EMAIL value in the configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/mailcow.conf
        regexp: '^ACME_ACCOUNT_EMAIL='
        line: 'ACME_ACCOUNT_EMAIL=wiehana@tnfs.co.za'
        backrefs: yes

    - name: Create data/conf/acme/dns-01.conf
      ansible.builtin.copy:
        dest: /local/mailcow-dockerized/data/conf/acme/dns-01.conf
        content: |
          # CloudFlare API Token (NOT Global API Key!)
          # Create at: https://dash.cloudflare.com/profile/api-tokens
          # Permissions: Zone > DNS > Edit for zone 'example.com'
          CF_Token="{{ cf_apitoken }}"
          CF_Account_ID="{{ cf_accountid }}"

    - name: Create docker-compose.override.yml file
      ansible.builtin.copy:
        dest: /local/mailcow-dockerized/docker-compose.override.yml
        content: |
          services:
            borgmatic-mailcow:
              image: ghcr.io/borgmatic-collective/borgmatic
              hostname: mailcow
              restart: always
              dns: ${IPV4_NETWORK:-172.22.1}.254
              volumes:
                - vmail-vol-1:/mnt/source/vmail
                - crypt-vol-1:/mnt/source/crypt:ro
                - redis-vol-1:/mnt/source/redis:ro
                - rspamd-vol-1:/mnt/source/rspamd:ro
                - postfix-vol-1:/mnt/source/postfix:ro
                - mysql-socket-vol-1:/var/run/mysqld/
                - borg-config-vol-1:/root/.config/borg
                - borg-cache-vol-1:/root/.cache/borg
                - ./data/conf/borgmatic/etc:/etc/borgmatic.d:Z
                - ./data/conf/borgmatic/ssh:/root/.ssh:Z
              environment:
                - TZ=${TZ}
                - BORG_PASSPHRASE={{ BORG_PASSPHRASE }}
              networks:
                mailcow-network:
                  aliases:
                    - borgmatic
          volumes:
            borg-cache-vol-1:
            borg-config-vol-1:

    - name: Create folder with specific permissions
      ansible.builtin.file:
        path: /local/mailcow-dockerized/data/conf/borgmatic/ssh
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create id_ed25519.pub file
      ansible.builtin.copy:
        dest: /local/mailcow-dockerized/data/conf/borgmatic/ssh/id_ed25519.pub
        content: |
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMjb/AED9nl0G12/ePDyJSjyGiEI/uNa34/kUQNudsaU wiehana@tnfs.co.za
        owner: root
        group: root
        mode: '0644'

    - name: Create id_ed25519 file
      ansible.builtin.copy:
        dest: /local/mailcow-dockerized/data/conf/borgmatic/ssh/id_ed25519
        content: |
          -----BEGIN OPENSSH PRIVATE KEY-----
          b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
          QyNTUxOQAAACDI2/wBA/Z5dBtdv3jw8iUo8hohCP7jWt+P5FEDbnbGlAAAAJjnSimk50op
          pAAAAAtzc2gtZWQyNTUxOQAAACDI2/wBA/Z5dBtdv3jw8iUo8hohCP7jWt+P5FEDbnbGlA
          AAAEA3O97P55mC5Esnjni9OuY4bOR6H3r6YakzrPYCtVMR8cjb/AED9nl0G12/ePDyJSjy
          GiEI/uNa34/kUQNudsaUAAAAEndpZWhhbmFAdG5mcy5jby56YQECAw==
          -----END OPENSSH PRIVATE KEY-----
        owner: root
        group: root
        mode: '0600'

    - name: Read mailcow.conf and extract DBNAME
      shell: |
        grep '^DBNAME=' /local/mailcow-dockerized/mailcow.conf | awk -F'=' '{print $2}'
      register: db_name_result

    - set_fact:
        DBNAME: "{{ db_name_result.stdout | trim }}"

    - name: Debug DBNAME
      debug:
        var: DBNAME

    - name: Read mailcow.conf and extract DBUSER
      shell: |
        grep '^DBUSER=' /local/mailcow-dockerized/mailcow.conf | awk -F'=' '{print $2}'
      register: db_user_result

    - set_fact:
        DBUSER: "{{ db_user_result.stdout | trim }}"

    - name: Debug DBUSER
      debug:
        var: DBUSER

    - name: Read mailcow.conf and extract DBPASS
      shell: |
        grep '^DBPASS=' /local/mailcow-dockerized/mailcow.conf | awk -F'=' '{print $2}'
      register: db_pass_result

    - set_fact:
        DBPASS: "{{ db_pass_result.stdout | trim }}"

    - name: Debug DBPASS
      debug:
        var: DBPASS

    - name: Ensure DBNAME, DBUSER, and DBPASS are set
      debug:
        msg: "DBNAME: {{ DBNAME }}, DBUSER: {{ DBUSER }}, DBPASS: {{ DBPASS }}"

    - name: Create borgmatic config directory
      ansible.builtin.file:
        path: /local/mailcow-dockerized/data/conf/borgmatic/etc
        state: directory
        mode: '0755'

    - name: Create borgmatic config.yaml from template
      ansible.builtin.template:
        src: templates/config2.yaml.j2
        dest: /local/mailcow-dockerized/data/conf/borgmatic/etc/config.yaml
        owner: root
        group: root
        mode: '0644'

    - name: Update configuration file
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/data/conf/borgmatic/etc/config.yaml
        regexp: '^    - path: ssh://user@rsync.net:22/./mailcow'
        line: '    - path: ssh://{{ borguser }}@{{ borgserver }}//urbackupdata/mailcow'
        backrefs: yes

