    - name: Block outgoing traffic on port 587 using UFW
      ansible.builtin.ufw:
        rule: deny
        port: 587
        proto: tcp
        direction: out
        comment: "Block outgoing traffic on port 587"

    - name: Block all incoming traffic from 10.131.77.20
      ansible.builtin.ufw:
        rule: deny
        from_ip: 10.131.77.20
        direction: in
        comment: "Block all incoming traffic from 10.131.77.20"

    - name: Block all outgoing traffic to 10.131.77.20
      ansible.builtin.ufw:
        rule: deny
        to_ip: 10.131.77.20
        direction: out
