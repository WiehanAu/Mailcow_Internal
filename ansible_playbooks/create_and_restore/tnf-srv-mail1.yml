    - name: Start Docker containers for Mailcow
      ansible.builtin.command: sudo docker compose up -d
      args:
        chdir: /local/mailcow-dockerized

    - name: Stop Docker containers for Mailcow
      ansible.builtin.command: sudo docker compose down
      args:
        chdir: /local/mailcow-dockerized

    - name: Update dovecot.conf to disable crypt
      ansible.builtin.lineinfile:
        path: /local/mailcow-dockerized/data/conf/dovecot/dovecot.conf
        regexp: '^  mail_crypt_save_version ='
        line: '  mail_crypt_save_version = 0'
        backrefs: yes

    - name: Rename ecprivkey.pem to ecprivkey.pem.bak
      command: mv /var/lib/docker/volumes/mailcowdockerized_crypt-vol-1/_data/ecprivkey.pem /var/lib/docker/volumes/mailcowdockerized_crypt-vol-1/_data/ecprivkey.pem.bak

    - name: Rename ecpubkey.pem to ecpubkey.pem.bak
      command: mv /var/lib/docker/volumes/mailcowdockerized_crypt-vol-1/_data/ecpubkey.pem /var/lib/docker/volumes/mailcowdockerized_crypt-vol-1/_data/ecpubkey.pem.bak

    - name: Create ecprivkey.pem file
      ansible.builtin.copy:
        dest: /var/lib/docker/volumes/mailcowdockerized_crypt-vol-1/_data/ecprivkey.pem
        content: |
          -----BEGIN PRIVATE KEY-----
          MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgZpxxLrN1inXE9Zzu
          TZQe2F/GIEXRbDZ9kEFK7ue9KEGhRANCAASpp59HKDw3f47rtnUIDzW+fDgT0z8J
