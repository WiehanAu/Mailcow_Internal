    - name: Block all outgoing traffic to 10.131.77.21
      ansible.builtin.ufw:
        rule: deny
        to_ip: 10.131.77.21
        direction: out
        comment: "Block all outgoing traffic to 10.131.77.21"

    - name: Allow SSH through the firewall
      ansible.builtin.ufw:
        rule: allow
        name: OpenSSH

    - name: Enable UFW
      ansible.builtin.ufw:
        state: enabled
        policy: allow

